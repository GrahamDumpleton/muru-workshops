# What the workshop manifests cannot supply to the collection indexes:
# the analytics block, which `just index` copies into every index under
# collections/ when it writes them. The sink is the workshops' own
# analytics service. One ingest token serves every collection and every
# deployment, since each event carries its collection's id and says
# whether it came from Binder or Codespaces. The token is public by
# construction, since the indexes are.
